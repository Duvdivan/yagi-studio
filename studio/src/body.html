<div id="app">
  <header class="top">
    <div class="brand" aria-label="Yagi Studio">
      <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M2 11H28"/><path d="M4 2V20"/><path d="M11 3.500V18.500"/><path d="M18 5V17"/><path d="M25 6.500V15.500"/>
      </svg>
      <b>Yagi Studio</b>
    </div>
    <input class="design-name" id="design-name" aria-label="Design name" spellcheck="false">
    <div class="tools">
      <button class="btn" id="open">Open</button>
      <button class="btn" id="save">Save</button>
      <button class="btn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3L2.500 6.500L6 10"/><path d="M3 6.500H10A3.500 3.500 0 0 1 10 13.500H7"/></svg>
      </button>
      <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L13.500 6.500L10 10"/><path d="M13 6.500H6A3.500 3.500 0 0 0 6 13.500H9"/></svg>
      </button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
    <div class="spacer"></div>
    <div class="tools">
      <span class="status" id="status" aria-live="off"></span>
      <button class="btn" id="about">How far to trust it</button>
      <button class="btn icon" id="theme" title="Light or dark" aria-label="Switch between light and dark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2A6 6 0 0 1 8 14Z" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>
  <main>
    <div id="host-design"></div>
    <div id="host-optimize" hidden></div>
    <div id="host-check" hidden></div>
    <div id="host-cut" hidden></div>
    <div id="host-print" hidden></div>
    <div id="host-tune" hidden></div>
  </main>
</div>
