<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yagi Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* A drafting-table instrument: blueprint neutrals, one cobalt accent, a marker orange for the cursor.
   Layout: a toolbar over a three-pane bench, which stacks into one column on a phone. */
:root {
  --bg: #e6ecf1;
  --panel: #fbfcfd;
  --raised: #ffffff;
  --sunken: #eef2f6;
  --ink: #0f1c29;
  --ink2: #3f4f5e;
  --muted: #5f6f7e;
  --line: #d5dde4;
  --line2: #b6c2cc;
  --accent: #1a5bb5;
  --accent-ink: #ffffff;
  --accent-soft: #dce8f7;
  --marker: #c04a17;
  --s1: #1f6fd1;
  --s2: #e0602c;
  --s3: #16a06f;
  --pin: #7a8895;
  --good: #0a8a3a;
  --warn: #a86b00;
  --bad: #c43232;
  --grid: #e3e9ee;
  --axis: #b6c2cc;
  --band: rgba(31, 111, 209, 0.08);
  --shadow: 0 1px 2px rgba(15, 28, 41, .08), 0 8px 24px rgba(15, 28, 41, .08);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --display: "Barlow Condensed", "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151f; --panel: #141f2c; --raised: #1a2838; --sunken: #101a25; --ink: #e7eef5; --ink2: #b9c7d4; --muted: #8fa1b2;
    --line: #26364a; --line2: #3a4d63; --accent: #5b9ff0; --accent-ink: #08131f; --accent-soft: #1b3350; --marker: #ff8a4f;
    --s1: #4d94ea; --s2: #e0693a; --s3: #22a87a; --pin: #8695a4; --good: #3fc06f; --warn: #e6ab3c; --bad: #ef6f6f;
    --grid: #1e2c3c; --axis: #3a4d63; --band: rgba(77, 148, 234, 0.11);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151f; --panel: #141f2c; --raised: #1a2838; --sunken: #101a25; --ink: #e7eef5; --ink2: #b9c7d4; --muted: #8fa1b2;
  --line: #26364a; --line2: #3a4d63; --accent: #5b9ff0; --accent-ink: #08131f; --accent-soft: #1b3350; --marker: #ff8a4f;
  --s1: #4d94ea; --s2: #e0693a; --s3: #22a87a; --pin: #8695a4; --good: #3fc06f; --warn: #e6ab3c; --bad: #ef6f6f;
  --grid: #1e2c3c; --axis: #3a4d63; --band: rgba(77, 148, 234, 0.11);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
[hidden] { display: none !important; }

/* --- the toolbar --- */
#app { display: flex; flex-direction: column; height: 100%; min-width: 0; }
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-block: 10px;
}
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { display: block; color: var(--accent); }
.brand b { font: 600 21px/1 var(--display); letter-spacing: .01em; white-space: nowrap; }
.design-name {
  min-width: 0; width: 240px; max-width: 100%; border: 1px solid transparent; background: transparent; border-radius: 4px;
  padding: 4px 6px; font-weight: 500;
}
.design-name:hover { border-color: var(--line2); }
.design-name:focus { background: var(--raised); border-color: var(--accent); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.tabs button {
  border: 0; background: transparent; padding: 5px 12px; border-radius: 4px; font-weight: 500; color: var(--ink2); cursor: pointer; white-space: nowrap;
}
.tabs button:hover { color: var(--ink); background: var(--panel); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.spacer { flex: 1 1 auto; min-width: 0; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line2); background: var(--raised);
  padding: 5px 10px; min-height: 30px; border-radius: 5px; cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.icon { width: 30px; padding: 0; }
.btn.small { min-height: 24px; padding: 2px 8px; font-size: 12px; }
.status { font: 12px/1 var(--mono); color: var(--muted); white-space: nowrap; }

/* --- the bench --- */
main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding-bottom: 12px; }
main > div { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.view { flex: 1 1 auto; min-height: 0; display: grid; gap: 10px; }
.view-design { grid-template-columns: 340px minmax(0, 1fr) 372px; }
.view-three { grid-template-columns: 320px minmax(0, 1fr) 372px; }
.view-two { grid-template-columns: 340px minmax(0, 1fr); }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.col.mid { overflow: hidden; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; min-width: 0; }
.card > .head {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 12px 0;
}
.card > .head h2, .label-h {
  font: 600 12px/1.3 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--ink2);
}
.card .body { padding: 8px 12px 12px; }
.grow { flex: 1 1 0; min-height: 200px; display: flex; flex-direction: column; }
.canvas-box { position: relative; flex: 1 1 auto; min-height: 0; }
/* a finger can scroll the page past a chart; only the rod drawing needs the whole gesture */
.canvas-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
#layout { touch-action: none; }

/* --- what the antenna is for --- */
.radio-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.mono-line { font: 12px var(--mono); color: var(--ink2); overflow-wrap: anywhere; }
.radio-more summary { cursor: pointer; font-size: 13px; }
.kv-row { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); }
.kv-row b { display: block; font: 500 13px var(--mono); color: var(--ink); }
.linkish { border: 0; padding: 0; background: none; color: var(--accent); text-decoration: underline; font: inherit; cursor: pointer; }
.pick-list { display: flex; flex-direction: column; gap: 2px; }
.pick-list.scroll { max-height: min(50vh, 420px); overflow-y: auto; }
.pick-list h3 { font: 600 11px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 3px; }
.pick { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--raised); padding: 8px 10px; border-radius: 5px; cursor: pointer; }
.pick[hidden] { display: none; }
.pick .pill { margin-left: 8px; }
.pick small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.pick:hover:not(:disabled), .pick:focus-visible { background: var(--accent-soft); }
.pick:disabled { opacity: .55; cursor: default; }
.pick-search { width: 100%; margin-bottom: 8px; text-align: left; }

/* --- forms --- */
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.field-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field > span, .field > label { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 4px; }
input.num, input.txt, select.sel, textarea.txt {
  width: 100%; min-width: 0; border: 1px solid var(--line2); background: var(--raised); border-radius: 4px; padding: 4px 6px; min-height: 28px;
}
input.num { font: 12.5px var(--mono); font-variant-numeric: tabular-nums; }
input.num:focus, input.txt:focus, select.sel:focus, textarea.txt:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
input.bad { border-color: var(--bad); }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.help {
  display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line2); background: transparent;
  color: var(--muted); font: 600 10px/1 var(--sans); cursor: help; padding: 0; flex: none;
}
.help:hover, .help:focus-visible { color: var(--accent); border-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); }
.sep { height: 1px; background: var(--line); margin: 10px 0; }
details > summary { cursor: pointer; font-weight: 500; list-style-position: inside; }

/* --- the rod table --- */
.rods { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rods.fixed { table-layout: fixed; min-width: 286px; }
input::placeholder { color: var(--muted); opacity: .75; }
.rods th { font: 500 11px var(--sans); color: var(--muted); text-align: left; padding: 0 3px 3px; white-space: nowrap; }
.rods td { padding: 1.5px 2px; vertical-align: middle; }
.rods tr.hot td { background: var(--accent-soft); }
.rods .rod-name { font-weight: 600; font-size: 12px; white-space: nowrap; padding-left: 4px; }
.rods input.num { padding: 2px 3px; min-height: 26px; }
.rods .x { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 4px; font-size: 14px; line-height: 1; }
.rods .x:hover { color: var(--bad); }
.scroll-x { overflow-x: auto; }

/* --- readouts --- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 0 0 7px 7px; overflow: hidden; }
.kpi { background: var(--panel); padding: 8px 12px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 4px; }
.kpi .v { font: 500 21px/1.25 var(--sans); }
.kpi .v small { font: 400 12px var(--sans); color: var(--muted); margin-left: 3px; }
.kpi .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.good { color: var(--good); }
.pill.warn { color: var(--warn); }
.pill.warn::before { border-radius: 1px; transform: rotate(45deg); }
.pill.bad { color: var(--bad); }
.pill.bad::before { border-radius: 1px; }
.insight { padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; }
.insight b { font-weight: 600; }
.insight .tip { color: var(--ink2); }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 5px; padding: 1px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 1px var(--line2); }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; border-radius: 1px; }

/* --- tables of numbers --- */
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; font: 500 12px var(--sans); color: var(--muted); padding: 3px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
.tbl td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; font-family: var(--sans); }
.tbl tr.total td { font-weight: 600; }
.gf-table th, .gf-table td { padding-left: 4px; padding-right: 4px; }
.tbl .better { color: var(--good); }
.tbl .worse { color: var(--bad); }
.progress { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s linear; }

/* --- pop-overs --- */
.tipbox {
  position: fixed; z-index: 50; max-width: 300px; pointer-events: none; background: var(--raised); color: var(--ink); border: 1px solid var(--line2);
  border-radius: 6px; padding: 7px 9px; font-size: 12.5px; box-shadow: var(--shadow);
}
.tipbox b { font-weight: 600; }
.tipbox .mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.menu {
  position: fixed; z-index: 40; min-width: 260px; max-height: 80vh; overflow: auto; background: var(--raised); border: 1px solid var(--line2);
  border-radius: 7px; padding: 5px; box-shadow: var(--shadow);
}
.menu h3 { font: 600 11px var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 7px 8px 3px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
.menu button small { display: block; color: var(--muted); font-size: 12px; }
.menu button:hover, .menu button:focus-visible { background: var(--accent-soft); }
.toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--panel);
  padding: 7px 12px; border-radius: 6px; font-size: 13px; max-width: min(520px, 90vw); box-shadow: var(--shadow);
}
.modal-back { position: fixed; inset: 0; background: rgba(8, 16, 26, .45); z-index: 45; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; box-shadow: var(--shadow); width: min(640px, 100%); max-height: 88vh; overflow: auto; padding: 16px; }
.modal h2 { font: 600 19px/1.2 var(--display); margin-bottom: 6px; }
.modal p { margin-bottom: 8px; max-width: 65ch; color: var(--ink2); }
.modal textarea { width: 100%; height: 170px; font: 12px var(--mono); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hist-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.hist-grid .card { min-height: 180px; display: flex; flex-direction: column; }
.stat-line { font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.sheet h1 { font: 600 24px/1.1 var(--display); }
.empty { padding: 24px 16px; color: var(--muted); text-align: center; }

/* Windows narrower than a laptop stack the three panes and let the page scroll. */
@media (max-width: 1180px) {
  html, body { height: auto; }
  #app { height: auto; }
  .view, .view-design, .view-three, .view-two { grid-template-columns: minmax(0, 1fr); }
  .col, .col.mid { overflow: visible; }
  main > div { display: block; }
  .grow { flex: none !important; }
  .tall-sm { height: 300px; }
  .tall-md { height: 460px; }
  .hist-grid .card { height: 220px; }
}
@media (min-width: 1181px) and (max-width: 1500px) {
  .view-design { grid-template-columns: 318px minmax(0, 1fr) 320px; }
  .view-three { grid-template-columns: 290px minmax(0, 1fr) 320px; }
}
@media (max-width: 560px) {
  .hist-grid { grid-template-columns: minmax(0, 1fr); }
  .design-name { width: 100%; order: 3; }
  .kpi .v { font-size: 18px; }
  /* the tabs stay under the thumb on a long page */
  #app { padding-bottom: calc(58px + env(safe-area-inset-bottom)); }
  .tabs {
    position: fixed; inset: auto 0 0 0; z-index: 30; flex-wrap: nowrap; gap: 2px; border-radius: 0; border-width: 1px 0 0;
    background: var(--panel); padding: 5px 5px calc(5px + env(safe-area-inset-bottom));
  }
  .tabs button { flex: 1 1 0; min-width: 0; min-height: 44px; padding: 4px 2px; font-size: 12.5px; line-height: 1.15; white-space: normal; }
  .toast { bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .progress i { transition: none; }
}
@media print {
  body { background: #fff; color: #000; padding: 0; }
  .top, .no-print { display: none !important; }
  .card { border: 0; }
  #app, main, .view, .col { display: block; height: auto; overflow: visible; }
}

/* the web app: how to install it */
.install-hint { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; font-size: 13px; }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="brand" aria-label="Yagi Studio">
      <svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M2 11H28"/><path d="M4 2V20"/><path d="M11 3.500V18.500"/><path d="M18 5V17"/><path d="M25 6.500V15.500"/>
      </svg>
      <b>Yagi Studio</b>
    </div>
    <input class="design-name" id="design-name" aria-label="Design name" spellcheck="false">
    <div class="tools">
      <button class="btn" id="open">Open</button>
      <button class="btn" id="save">Save</button>
      <button class="btn icon" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3L2.500 6.500L6 10"/><path d="M3 6.500H10A3.500 3.500 0 0 1 10 13.500H7"/></svg>
      </button>
      <button class="btn icon" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L13.500 6.500L10 10"/><path d="M13 6.500H6A3.500 3.500 0 0 0 6 13.500H9"/></svg>
      </button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
    <div class="spacer"></div>
    <div class="tools">
      <span class="status" id="status" aria-live="off"></span>
      <button class="btn" id="about">How far to trust it</button>
      <button class="btn icon" id="theme" title="Light or dark" aria-label="Switch between light and dark">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2A6 6 0 0 1 8 14Z" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>
  <main>
    <div id="host-design"></div>
    <div id="host-optimize" hidden></div>
    <div id="host-check" hidden></div>
    <div id="host-cut" hidden></div>
    <div id="host-tune" hidden></div>
  </main>
</div>

<script type="text/plain" id="ys-worker-src">
/*
 * Yagi Studio solver: method of moments for parallel, centre-fed rods.
 *
 * Method. Galerkin moment method with Richmond's piecewise-sinusoidal basis (the same basis as
 * yagi_nec.py, the first solver written for the DuvYagi). The sine tent has a closed-form field, so only the test integral is
 * numeric. It differs from yagi_nec.py and from NEC-2 in two ways, both about thick rods:
 *
 *  1. The kernel. NEC-2's thin-wire kernel and yagi_nec.py put the current on the axis and test
 *     on the surface. That is only accurate while segments are much longer than the radius, so
 *     results drift with segment count on a 3 mm rod at 900 MHz. Here the current is a uniform
 *     tube, as on a real rod, and the field is averaged round the surface (the "exact kernel" of
 *     Pocklington's and Hallen's equations: King, "The Theory of Linear Antennas", 1956; Werner,
 *     IEEE Trans. AP 46, 1998). The mean of 1/R round a circle of radius a is exactly
 *     1 / agm(sqrt(z^2 + 4 a^2), |z|), the arithmetic-geometric mean form of the complete elliptic
 *     integral. The dynamic remainder is smooth and is taken at the mean squared distance.
 *
 *  2. The mesh. The current on a tube has a square-root edge at each tip, so uniform segments
 *     converge slowly. Panels here are graded: fine at the tips, and at the gap on the fed rod,

      vals = order.map((i) => vals[i]);
      if (Math.abs(vals[n] - vals[0]) < 1e-5) break;
      const c = new Array(n).fill(0);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) c[j] += simplex[i][j] / n;
      const worst = simplex[n];
      const at = (t) => c.map((v, j) => v + t * (worst[j] - v));
      const r = at(-1), fr = fn(r);
      evals++;
      if (fr < vals[0]) {
        const e = at(-2), fe = fn(e);
        evals++;
        if (fe < fr) { simplex[n] = e; vals[n] = fe; } else { simplex[n] = r; vals[n] = fr; }
      } else if (fr < vals[n - 1]) {
        simplex[n] = r; vals[n] = fr;
      } else {
        const k = at(fr < vals[n] ? -0.5 : 0.5), fk = fn(k);
        evals++;
        if (fk < Math.min(fr, vals[n])) { simplex[n] = k; vals[n] = fk; } else {
          for (let i = 1; i <= n; i++) {
            simplex[i] = simplex[i].map((v, j) => simplex[0][j] + 0.5 * (v - simplex[0][j]));
            vals[i] = fn(simplex[i]);
            evals++;
          }
        }
      }
    }
    let b = 0;
    for (let i = 1; i <= n; i++) if (vals[i] < vals[b]) b = i;
    return { x: simplex[b], value: vals[b], evals };
  }

  /* ---------- a solver run that reuses its mesh and matrix ---------- */
  function runner(solver, quality, counts) {
    const opts = { quality: quality || "draft" };
    const pin = counts || YS.buildWires(solver, opts).map((w) => w.m);
    let size = 0;
    for (const m of pin) size += m;
    const ws = YS.workspace(size);
    const run = (s, f, level) => {
      if (YS.isCrooked(s)) return YS.crooked.sweep(s, [f], { counts: pin, level })[0];
      const wires = YS.buildWires(s, { counts: pin });
      YS.assignOffsets(wires);
      return YS.metricsAt(wires, s.feed, s.gap === undefined ? 3 : s.gap, f, ws, s.z0 || 50, level || 0);
    };
    /** For many frequencies on one unchanged design: builds its mesh once. */
    run.fixed = (s) => {
      if (YS.isCrooked(s)) {
        const sys = YS.crooked.prepare(s, { counts: pin });
        return (f, level) => YS.crooked.metrics(sys, f, level || 0);
      }
      const wires = YS.buildWires(s, { counts: pin });
      YS.assignOffsets(wires);
      return (f, level) => YS.metricsAt(wires, s.feed, s.gap === undefined ? 3 : s.gap, f, ws, s.z0 || 50, level || 0);
    };
    return run;
  }

  /** The lowest SWR on a frequency grid, refined with a parabola through its neighbours. */
  function valleyOf(run, s, lo, hi, n) {
    let bestI = 0, best = Infinity;
    const fs = [], vals = [], at = run.fixed(s);
    for (let i = 0; i < n; i++) {
      const f = lo + (hi - lo) * i / (n - 1), v = Math.log(at(f).swr);
      fs.push(f); vals.push(v);
      if (v < best) { best = v; bestI = i; }
    }
    let f = fs[bestI];
    if (bestI > 0 && bestI < n - 1) {
      const a = vals[bestI - 1], b = vals[bestI], c = vals[bestI + 1], den = a - 2 * b + c;
      if (den > 0) f += 0.5 * (a - c) / den * (fs[1] - fs[0]);
    }
    return { f, swr: Math.exp(best) };
  }

  /* ---------- optimiser ---------- */
  /**
   * ctx: { base: solver design, vars: [{ kind: "L", i, lo, hi } | { kind: "s", i, lo, hi }],
   *        goals: { fbMin, swrMax, gainWeight, fbWeight, swrWeight, boomMax, boomFixed, minGap },
   *        counts, freqs }
   */
  function applyVector(ctx, v) {
    const b = ctx.base;
    const elements = b.elements.map((e) => ({ x: e.x, L: e.L, d: e.d, material: e.material }));
    const spacing = [];
    for (let i = 0; i + 1 < elements.length; i++) spacing.push(elements[i + 1].x - elements[i].x);
    const free = new Array(spacing.length).fill(false);
    ctx.vars.forEach((va, j) => {
      if (va.kind === "L") elements[va.i].L = v[j];
      else { spacing[va.i] = v[j]; free[va.i] = true; }
    });
    const g = ctx.goals;
    let total = 0, fixed = 0;
    spacing.forEach((s, i) => { total += s; if (!free[i]) fixed += s; });
    const target = g.boomFixed ? g.boomFixed : g.boomMax && total > g.boomMax ? g.boomMax : 0;
    if (target && total > fixed) {
      const k = Math.max(target - fixed, 1e-3) / (total - fixed);
      spacing.forEach((s, i) => { if (free[i]) spacing[i] = s * k; });
    }
    let x = elements[0].x;
    for (let i = 0; i < spacing.length; i++) { x += spacing[i]; elements[i + 1].x = x; }
    return Object.assign({}, b, { elements });
  }

  const FAVOR_GAIN = 40;      // cost per dB of gain outside what was asked for
  const FAVOR_UNMET = 100;    // cost of missing the gain or a limit, above anything a design's SWR or F/B can score
  const RL_ENOUGH = 34;       // dB of return loss, SWR 1.04: no one can build or measure a better match than this
  const FB_ENOUGH = 40;       // dB of F/B: past this it's a sharp null that the mast or a bent rod will fill in
  const FAVOR_BOOM = 1.5;     // dB a wavelength of boom has to earn, so that it doesn't grow for nothing
  /* SWR as return loss, dB, so that it can be set beside F/B. */
  const returnLoss = (swr) => -20 * Math.log10(Math.max((swr - 1) / (swr + 1), 1e-3));

  const costParts = (ctx, run, s) => {
    const g = ctx.goals;
    let worstGain = Infinity, worstSwr = 0, minFb = Infinity, penalty = 0;
    const at = run.fixed(s);
    for (const f of ctx.freqs) {
      const r = at(f);
      if (r.gainDbd < worstGain) worstGain = r.gainDbd;
      if (r.swr > worstSwr) worstSwr = r.swr;
      if (r.fb < minFb) minFb = r.fb;
      if (r.swr > g.swrMax) penalty += g.swrWeight * Math.min(r.swr - g.swrMax, 30);
      if (r.fb < g.fbMin) penalty += g.fbWeight * (g.fbMin - r.fb);
    }
    // rods packed very closely break the model's assumptions and are hard to build
    for (let i = 0; i + 1 < s.elements.length; i++) {
      const gap = s.elements[i + 1].x - s.elements[i].x;
      if (gap < g.minGap) penalty += 5 * (g.minGap - gap);
    }
    if (g.favor && g.favor !== "gain") {
      // the gain and the limits come first: a design that misses one always loses to one that meets them all
      if (worstGain < g.gainMin) penalty += FAVOR_GAIN * (g.gainMin - worstGain);
      if (g.gainMax && worstGain > g.gainMax) penalty += FAVOR_GAIN * (worstGain - g.gainMax);
      if (penalty > 0) return { worstGain, worstSwr, minFb, cost: FAVOR_UNMET + penalty };
      const rl = Math.min(returnLoss(worstSwr), RL_ENOUGH), fb = Math.min(minFb, FB_ENOUGH);
      const aim = g.favor === "swr" ? rl : g.favor === "fb" ? fb : Math.min(rl, fb) + 0.1 * Math.max(rl, fb);
      const boom = s.elements[s.elements.length - 1].x - s.elements[0].x;
      return { worstGain, worstSwr, minFb, cost: -aim + FAVOR_BOOM * boom / g.lam };
    }
    if (g.gainMax && worstGain > g.gainMax) penalty += FAVOR_GAIN * (worstGain - g.gainMax);
    return { worstGain, worstSwr, minFb, cost: -(g.gainWeight || 1) * worstGain + penalty };
  };

  let liveCtx = null, liveRun = null;
  function setContext(ctx) {
    liveCtx = ctx;
    liveRun = runner(ctx.base, "draft", ctx.counts);
    return true;
  }

  function evalVectors(vectors) {
    return vectors.map((v) => costParts(liveCtx, liveRun, applyVector(liveCtx, v)));
  }

  /** The final polish, at higher quality, of the best vector. */
  function polish({ ctx, x0, maxEval }) {
    const run = runner(ctx.base, "normal");
    const steps = ctx.vars.map((va) => Math.max((va.hi - va.lo) * 0.01, 0.2));
    const clamp = (v) => v.map((x, j) => Math.min(ctx.vars[j].hi, Math.max(ctx.vars[j].lo, x)));
    const f = (v) => costParts(ctx, run, applyVector(ctx, clamp(v))).cost;
    const res = nelderMead(f, x0, steps, maxEval || 400);
    const x = clamp(res.x);
    return { x, parts: costParts(ctx, run, applyVector(ctx, x)), solver: applyVector(ctx, x) };
  }

  /* ---------- build errors ---------- */
  /** tol: { rod, pos, trim, seed, f0, count }. rod and pos are typical errors (1 sigma), mm. */
  function monteCarlo({ solver, tol, quality }) {
    const run = runner(solver, quality || "draft");
    const r = rng(tol.seed || 1);
    const out = [];
    const f0 = tol.f0 || solver.f0;
    const span = 0.03 * f0;
    for (let n = 0; n < tol.count; n++) {
      // tol.bend: each half bent this far, typically, any way. The general solver makes this much slower
      const halfBend = () => ({ deg: Math.abs(tol.bend * r.normal()), az: 360 * r(), from: solver.boomFace });
      const elements = solver.elements.map((e, i) => ({
        x: e.x + (i === 0 ? 0 : tol.pos * r.normal()), L: e.L + tol.rod * r.normal(), d: e.d, material: e.material,
        crook: tol.bend ? { upper: halfBend(), lower: halfBend() } : e.crook,
      }));
      const s = Object.assign({}, solver, { elements });
      let trimmed = true;
      if (tol.trim) {
        const x = (L) => { elements[s.feed].L = L; return run(s, f0).z[1]; };
        const start = solver.elements[s.feed].L;
        let a = start - 10, b = start + 12, fa = x(a), fb = x(b), de = start;
        if (fa * fb > 0) trimmed = false;
        else {
          for (let i = 0; i < 12; i++) {
            const m = fb - fa !== 0 ? b - fb * (b - a) / (fb - fa) : (a + b) / 2;
            const c = m > Math.min(a, b) && m < Math.max(a, b) ? m : (a + b) / 2;
            const fc = x(c);
            de = c;
            if (Math.abs(fc) < 0.05) break;
            if (fa * fc <= 0) { b = c; fb = fc; } else { a = c; fa = fc; }
          }
        }
        elements[s.feed].L = de;
      }
      const m = run(s, f0);
      const v = valleyOf(run, s, f0 - span, f0 + span, 13);
      out.push({ swr: m.swr, gain: m.gainDbd, fb: m.fb, driven: elements[s.feed].L, trimmed, valley: v.f });
    }
    return out;
  }

  /* ---------- sensitivity ---------- */
  /** What each rod's length and position does, per millimetre, near the design. */
  function sensitivity({ solver: given, f0, delta, names }) {
    const d = delta || 0.5;
    const solver = Object.assign({}, given, { elements: given.elements.map((e) => ({ x: e.x, L: e.L, d: e.d, material: e.material })) });
    const run = runner(solver, "normal");
    const span = 0.035 * f0;
    const measure = (s) => {
      const m = run(s, f0);
      const v = valleyOf(run, s, f0 - span, f0 + span, 29);
      return { swr: m.swr, gain: m.gainDbd, fb: m.fb, x: m.z[1], r: m.z[0], valley: v.f };
    };
    const base = measure(solver);
    const rows = [];
    const change = (mutate, label, kind, index) => {
      const pert = (sign) => {
        const elements = solver.elements.map((e) => ({ x: e.x, L: e.L, d: e.d, material: e.material }));
        mutate(elements, sign * d);
        return measure(Object.assign({}, solver, { elements }));
      };
      const up = pert(1), dn = pert(-1), per = (k) => (up[k] - dn[k]) / (2 * d);
      rows.push({ label, kind, index, swr: per("swr"), gain: per("gain"), fb: per("fb"), valley: per("valley"), r: per("r"), x: per("x") });
    };
    solver.elements.forEach((e, i) => change((el, t) => { el[i].L += t; }, names[i] + " length", "length", i));
    solver.elements.forEach((e, i) => { if (i > 0) change((el, t) => { el[i].x += t; }, names[i] + " position", "position", i); });
    return { base, rows, delta: d };
  }

  /* ---------- the fit to VNA readings ---------- */
  /**
   * readings: [{ f, swr } or { f, g: [re, im] }]; cable: the line between the feed and the VNA,
   * or null. Finds how much longer or shorter each group of rods acts than its listed length.
   * weightPower: readings count as 1 / SWR^power. Tuning cares most about the valley, and the high
   * SWR sides are where a cable or nearby objects disturb a reading most, so 3 is the usual choice.
   * Comparing against 0 shows which answers depend on that choice.
   * fitCable: also find the cable's length. R and X are rotated by every millimetre of cable, so
   * the entered length is only a starting point; the rotation across a sweep gives the real one.
   */
  /**
   * What a design's bends do to its feed impedance, on a grid and interpolated: the general solver is too
   * slow to run thousands of times in a fit, and this difference barely moves with small changes in length.
   */
  function bendCorrection(solver, lo, hi) {
    if (!YS.isCrooked(solver)) return null;
    const straight = Object.assign({}, solver, { elements: solver.elements.map((e) => ({ x: e.x, L: e.L, d: e.d, material: e.material })) });
    const n = 9, grid = [];
    for (let i = 0; i < n; i++) grid.push(lo + (hi - lo) * i / (n - 1));
    const counts = YS.buildWires(straight, { quality: "draft" }).map((w) => w.m);
    const a = YS.crooked.sweep(solver, grid, { counts }), b = YS.sweep(straight, grid, { counts });
    const d = grid.map((_, i) => [a[i].z[0] - b[i].z[0], a[i].z[1] - b[i].z[1]]);
    return (f) => {
      const u = Math.max(0, Math.min(n - 1.000001, (f - lo) / (hi - lo) * (n - 1))), i = Math.floor(u), w = u - i;
      return [d[i][0] * (1 - w) + d[i + 1][0] * w, d[i][1] * (1 - w) + d[i + 1][1] * w];
    };
  }

  function fitReadings({ design, readings, cable, free, starts, weightPower, fitCable }) {
    const solver = YS.toSolver(Object.assign({}, design, { asBuilt: null }));
    const fs_ = readings.map((p) => p.f), bendFix = bendCorrection(solver, Math.min.apply(null, fs_), Math.max.apply(null, fs_) + 1e-6);
    const run = runner(solver, "draft");
    const roles = solver.elements.map((_, i) => (i === solver.feed ? "driven" : i < solver.feed ? "reflector" : "directors"));
    const groups = ["directors", "driven", "reflector"].filter((g) => free[g]);
    const power = weightPower === undefined ? 3 : weightPower;
    const weights = readings.map((p) => Math.pow(p.g ? YS.swrOfGamma(p.g) : p.swr, -power));
    let misfit = 0;
    const withOffsets = (v) => {
      const off = { directors: 0, driven: 0, reflector: 0 };
      groups.forEach((g, i) => { off[g] = v[i]; });
      const elements = solver.elements.map((e, i) => ({ x: e.x, d: e.d, material: e.material, L: e.L + off[roles[i]] }));
      return Object.assign({}, solver, { elements });
    };
    const nRods = groups.length;
    const predicted = (at, s, p, line) => {
      const m = at(p.f), fix = bendFix ? bendFix(p.f) : null;
      const g = YS.gammaOf(fix ? [m.z[0] + fix[0], m.z[1] + fix[1]] : m.z, s.z0 || 50);
      return line ? YS.gammaThroughCable(g, line, p.f) : g;
    };
    const lineFor = (v) => (fitCable ? Object.assign({}, cable, { length: Math.max(0, cable.length + v[nRods]) }) : cable);
    const cost = (v) => {
      for (let i = 0; i < nRods; i++) if (Math.abs(v[i]) > 12) return 1e6 + Math.abs(v[i]);
      if (fitCable && Math.abs(v[nRods]) > CABLE_RANGE) return 1e6 + Math.abs(v[nRods]);
      const s = withOffsets(v), at = run.fixed(s), line = lineFor(v);
      let e = 0, total = 0;
      readings.forEach((p, i) => {
        const g = predicted(at, s, p, line), w = weights[i];
        total += w;
        // near a match, the change in ln(SWR) is about twice the change in reflection
        if (p.g) e += w * 4 * ((g[0] - p.g[0]) ** 2 + (g[1] - p.g[1]) ** 2);
        else e += w * (Math.log(YS.swrOfGamma(g)) - Math.log(p.swr)) ** 2;
      });
      misfit = e / total;
      // with few readings many answers fit equally well: prefer the smallest change
      let pull = 0;
      for (let i = 0; i < nRods; i++) pull += v[i] * v[i];
      return misfit + FIT_PULL * pull;
    };
    let best = null;
    for (const st of starts) {
      const x0 = groups.map((g) => st[g] || 0).concat(fitCable ? [st.cable || 0] : []);
      const res = nelderMead(cost, x0, groups.map(() => 0.6).concat(fitCable ? [8] : []), 70 * x0.length);
      if (!best || res.value < best.value) best = res;
    }
    const offsets = { directors: 0, driven: 0, reflector: 0 };
    groups.forEach((g, i) => { offsets[g] = best.x[i]; });
    cost(best.x);
    const result = { offsets, rms: Math.sqrt(misfit), value: best.value };
    if (fitCable) result.cableLength = lineFor(best.x).length;
    return result;
  }

  /**
   * The ways to bring a built antenna onto its target, given how its rods act (the fitted offsets).
   * design: the antenna with the measured lengths in it. Each option lists what to do to each rod.
   * Filing only shortens a rod; anything longer means cutting a new one.
   */
  function tunePlan({ design, offsets, target }) {
    const base = YS.toSolver(Object.assign({}, design, { asBuilt: null }));
    const plain = runner(base, "draft"), bendFix = bendCorrection(base, 0.94 * target, 1.06 * target);
    const adjust = (m, f) => {
      if (!bendFix) return m;
      const d = bendFix(f), z = [m.z[0] + d[0], m.z[1] + d[1]];
      return Object.assign({}, m, { z, swr: YS.swrOf(z[0], z[1], base.z0 || 50) });
    };
    const run = (s, f, level) => adjust(plain(s, f, level), f);
    run.fixed = (s) => { const at = plain.fixed(s); return (f, level) => adjust(at(f, level), f); };
    const roles = base.elements.map((_, i) => (i === base.feed ? "driven" : i < base.feed ? "reflector" : "directors"));
    const names = design.elements.slice().sort((p, q) => p.x - q.x).map((e) => e.name);
    /** The model of the antenna with physical changes: rod index to added length. */
    const built = (change) => Object.assign({}, base, {
      elements: base.elements.map((e, i) => ({ x: e.x, d: e.d, material: e.material, L: e.L + offsets[roles[i]] + (change[i] || 0) })),
    });
    const span = 0.05 * target;
    const valley = (s) => valleyOf(run, s, target - span, target + span, 41);
    const drv = base.feed;

    /** The driven change that cancels the reactance at the target. */
    const tuneDriven = (change) => {
      const x = (dL) => run(built(Object.assign({}, change, { [drv]: dL })), target).z[1];
      let a = -12, b = 12, fa = x(a), fb = x(b);
      if (fa * fb > 0) return Math.abs(fa) < Math.abs(fb) ? a : b;
      for (let i = 0; i < 22 && b - a > 0.02; i++) {
        const m = 0.5 * (a + b), fm = x(m);
        if (fa * fm <= 0) { b = m; fb = fm; } else { a = m; fa = fm; }
      }
      return 0.5 * (a + b);
    };

    /** How much to change the given rods together so the valley lands on the target. */
    const solveRods = (rods) => {
      const miss = (x) => {
        const c = {};
        rods.forEach((i) => { c[i] = x; });
        return valley(built(c)).f - target;
      };
      let lo = -9, hi = 9, fl = miss(lo), fh = miss(hi);
      if (fl * fh > 0) return null;
      for (let i = 0; i < 16 && hi - lo > 0.03; i++) {
        const m = 0.5 * (lo + hi), fm = miss(m);
        if (fl * fm <= 0) { hi = m; fh = fm; } else { lo = m; fl = fm; }
      }
      return 0.5 * (lo + hi);
    };

    const describe = (id, title, why, change) => {
      const s = built(change), at = run.fixed(s);
      const m = at(target, 1);
      const curve = [];
      for (let i = 0; i <= 60; i++) {
        const f = target * (0.95 + 0.1 * i / 60);
        curve.push({ f, swr: at(f).swr });
      }
      const v = valley(s);
      const steps = base.elements.map((e, i) => {
        const dL = change[i] || 0;
        const action = Math.abs(dL) < 0.05 ? "keep" : dL < 0 ? "file" : "new";
        return { rod: names[i], role: roles[i], from: e.L, to: e.L + dL, change: dL, action };
      });
      const newRods = steps.filter((t) => t.action === "new").length;
      return { id, title, why, steps, newRods, swr: m.swr, gain: m.gainDbd, fb: m.fb, z: m.z, valley: v.f, valleySwr: v.swr, curve };
    };

    /**
     * Tips of the driven element and D1 moved along the boom, both halves alike. Apart raises the feed resistance and
     * moves the valley down; together does the reverse. Only offered if it clearly helps.
     */
    const bendOption = () => {
      const d1 = drv + 1;
      if (roles[d1] !== "directors") return null;
      const face = base.boomFace === undefined ? 10 : base.boomFace;
      const withTips = (dr, dd) => Object.assign({}, base, { elements: base.elements.map((e, i) => {
        const L = e.L + offsets[roles[i]], add = i === drv ? dr : i === d1 ? dd : 0, b = Object.assign({}, e.bend);
        if (add) { b.topF = (b.topF || 0) + add; b.botF = (b.botF || 0) + add; }
        const crook = YS.crookOf(b, L, face, i === drv);
        return { x: e.x, d: e.d, material: e.material, L, crook };
      }) });
      const counts = YS.buildWires(base, { quality: "draft" }).map((w) => w.m);
      const swrWith = (dr, dd) => YS.crooked.solve(YS.crooked.prepare(withTips(dr, dd), { counts }), target).swr;
      let best = null;
      const pairs = [[3, -3], [6, -6], [-3, 0], [0, 3]];
      for (const dr of [0, -3, -6, -9]) for (const dd of [0, 3, 6, 9]) if (dr || dd) pairs.push([dr, dd]);
      for (const [dr, dd] of pairs) {
        const v = swrWith(dr, dd), rank = v + 0.004 * (Math.abs(dr) + Math.abs(dd));
        if (!best || rank < best.rank) best = { dr, dd, swr: v, rank };
      }
      const now = swrWith(0, 0);
      if (best.swr > now - 0.03) return null;

      if (uiCount < 2 || freqs.length < 12) return this.run("sweep", { solver, freqs, quality, level: 0 }, "ui");

      for (let i = 0; i < freqs.length; i += size) parts.push(freqs.slice(i, i + size));

  /* ---------- optimiser: self-adapting differential evolution, then a local polish ---------- */
  function bandFreqs(band, f0) {
    const [a, b] = band;
    const fs = [a, (a + f0) / 2, f0, (f0 + b) / 2, b].sort((p, q) => p - q);
    return fs.filter((f, i) => i === 0 || f - fs[i - 1] > 1e-6);
  }

  function makeContext(design, goals) {
    const solver = YS.toSolver(design);
    const lam = 299792.458 / design.f0;
    const sorted = design.elements.slice().sort((a, b) => a.x - b.x);
    const near = goals.range === "near";
    const vars = [];
    sorted.forEach((e, i) => {
      const lock = (goals.locks && goals.locks[e.id]) || {};
      if (!lock.L && goals.changeLengths !== false) {
        const wide = e.type === "reflector" ? [0.44, 0.58] : e.type === "driven" ? [0.38, 0.54] : [0.34, 0.52];
        const lo = near ? e.L * 0.92 : wide[0] * lam, hi = near ? e.L * 1.08 : wide[1] * lam;
        vars.push({ kind: "L", i, lo: Math.min(lo, e.L), hi: Math.max(hi, e.L) });

        vars.push({ kind: "s", i, lo: Math.max(goals.minGap, Math.min(lo, gap)), hi: Math.max(hi, gap) });

      base: solver,
      vars,
      freqs: bandFreqs(goals.band, design.f0),
      goals: { fbMin: goals.fbMin, swrMax: goals.swrMax, fbWeight: 0.15, swrWeight: 3, gainWeight: 1,

    solver.elements.forEach((e, i) => {

  async function optimise(pool, design, goals, effort, hooks) {
    const ctx = makeContext(design, goals);
    const D = ctx.vars.length;

    await pool.broadcast("setContext", ctx);

    const NP = Math.max(24, Math.min(90, 6 * D));
    const gens = effort.gens;
    const clamp = (v, j) => Math.min(ctx.vars[j].hi, Math.max(ctx.vars[j].lo, v));
    // where the design stands now, as a starting vector
    const sorted = ctx.base.elements;

    scores.forEach((s, i) => { if (s.cost < scores[bestI].cost) bestI = i; });

    }
    if (hooks.onProgress) hooks.onProgress({ gen: gens, gens, evals, best: scores[bestI], history, solver: YS.applyVector(ctx, pop[bestI]), polishing: true });
    // finish at higher quality, from the best found
    const pol = await pool.run("polish", { ctx, x0: pop[bestI], maxEval: effort.polish });
    return { design: applyToDesign(design, pol.solver), parts: pol.parts, evals, history };
  }

    let best = null, tries = 0;

      tries++;

   * The boom is free here, up to goals.boomTop if that's set, because it's what pays for them. From the fewest
   * rods that hold the gain, up to where another rod no longer helps. Returns the same as findForGain.
   */

    const lam = 299792.458 / template.f0, rows = [];
    const cancelled = () => hooks.cancelled && hooks.cancelled();
    if (target > GAIN_TOPS[FIND_RODS] + FIND_SLACK) return { rows, best: null, tooHigh: FIND_RODS };

      let row = null;

        const r = await boomRun(pool, template, Object.assign({}, aim, { seed: (goals.seed || 7) + i }), n, Math.round(from), FIND_GENS, hooks, top);
        tries++;

        if (held(r) && r.gain >= target + FIND_MARGIN - 0.005 && (!row || r.cost < row.cost)) row = r;
        if (hooks.onProgress) hooks.onProgress({ tries, last: r, rows });

    }

      const rows = [];
      for (const l of txt.split(/\r?\n/)) {
        const v = l.trim().split(/\s+/).map(Number);
        if (v.length >= 3 && !v.some(isNaN) && v[0] > 1000) rows.push({ f: v[0] / 1e6, g: [v[1], v[2]] });

    }

    }

    A.bindNum($("#band-hi"), { get: () => d().band[1], min: 1, decimals: 3, set: (v, c) => { d().band[1] = v; change(c); } });
    A.bindNum($("#gap"), { get: () => d().gap, min: 0, max: 200, decimals: 2, set: (v, c) => {
      const driven = d().elements.find((e) => e.type === "driven");
      if (driven && $("#gap-rods").checked) driven.L = Math.round((driven.L + v - d().gap) * 1000) / 1000;
      d().gap = v;
      syncRodsValues();
      change(c);
    } });
    $("#wire-on").onchange = (e) => { d().feedWire = e.target.checked ? (S.lastWire || 0.3) : 0; A.commit(); syncWire(); change(false); };
    A.bindNum($("#wire-d"), { get: () => d().feedWire || S.lastWire || 0.3, min: 0.05, max: 10, decimals: 2, set: (v, c) => { S.lastWire = v; if (d().feedWire) d().feedWire = v; syncWire(); change(c); } });
    A.bindNum($("#bend-face"), { get: () => (d().boomFace === undefined ? 10 : d().boomFace), min: 0, max: 500, decimals: 1, set: (v, c) => { d().boomFace = v; change(c); } });
    $("#bend-clear").onclick = () => { d().elements.forEach((e) => { delete e.bend; }); A.commit(); renderBends(); change(false); };
    A.bindNum($("#z0"), { get: () => d().z0, min: 1, max: 1000, decimals: 1, set: (v, c) => { d().z0 = v; change(c); } });
    A.bindNum($("#mast-d"), { get: () => d().mast.d, min: 1, max: 500, set: (v, c) => { d().mast.d = v; change(c); } });
    A.bindNum($("#mast-b"), { get: () => d().mast.behind, min: 5, max: 5000, set: (v, c) => { d().mast.behind = v; change(c); } });
    A.bindNum($("#mast-l"), { get: () => d().mast.length, min: 50, max: 20000, decimals: 0, set: (v, c) => { d().mast.length = v; change(c); } });
    A.bindNum($("#ground-h"), { get: () => d().ground.height / 1000, min: 0.1, max: 500, decimals: 1, set: (v, c) => { d().ground.height = v * 1000; if (c) A.commit(); drawPattern(); } });
    $("#quality").value = S.quality;
    $("#quality").onchange = (e) => { S.quality = e.target.value; A.requestSolve("full"); };
    $("#pol").onchange = (e) => { d().polarization = e.target.value; A.commit(); A.designChanged(true); };
    $("#endcap").onchange = (e) => { d().endCap = e.target.checked; A.commit(); A.designChanged(false); };
    $("#mast-on").onchange = (e) => { d().mast.on = e.target.checked; $("#mast-fields").hidden = !e.target.checked; A.commit(); A.designChanged(false); };
    $("#ground-on").onchange = (e) => {
      d().ground.on = e.target.checked; $("#ground-fields").hidden = !e.target.checked; A.commit();
      if (e.target.checked) setPatternMode("ground"); else if (S.patternMode === "ground") setPatternMode("3d");
      syncPatternTabs();
    };
    $("#ground-k").innerHTML = Object.entries(A.GROUNDS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
    $("#ground-k").onchange = (e) => { d().ground.kind = e.target.value; A.commit(); drawPattern(); };
    $("#add-dir").onclick = () => {
      const els = d().elements.slice().sort((a, b) => a.x - b.x), last = els[els.length - 1], prev = els[els.length - 2];
      const gap = Math.max(last.x - prev.x, 0.1 * 299792.458 / d().f0);
      d().elements.push({ id: YS.newId(), type: "director", x: +(last.x + gap).toFixed(1), L: +(last.L * 0.985).toFixed(1), d: last.d, material: last.material });
      YS.renameElements(d().elements);
      A.commit();
      A.designChanged(true);
    };
    // the sweep's range and cursor
    A.bindNum($("#range-lo"), { get: () => S.range[0], min: 1, decimals: 2, set: (v, c) => { if (v < S.range[1]) { S.range[0] = v; S.rangeAuto = false; if (c) A.requestSolve("full"); } } });
    A.bindNum($("#range-hi"), { get: () => S.range[1], min: 1, decimals: 2, set: (v, c) => { if (v > S.range[0]) { S.range[1] = v; S.rangeAuto = false; if (c) A.requestSolve("full"); } } });
    $("#range-fit").onclick = () => { S.rangeAuto = true; A.autoRange(); $("#range-lo")._refresh(); $("#range-hi")._refresh(); A.requestSolve("full"); };
    A.bindNum($("#cursor-f"), { get: () => S.cursor, min: 1, decimals: 3, set: (v, c) => { S.cursor = v; drawSweep(); if (c) A.requestSolve("cursor"); } });
    $("#to-target").onclick = () => setCursor(d().f0);
    $("#to-valley").onclick = () => { if (S.rows) setCursor(+A.valleyOfRows(S.rows).f.toFixed(3)); };
    $("#pin").onclick = () => {
      if (S.pinned) { S.pinned = null; $("#pin").textContent = "Pin"; } else if (S.rows) { S.pinned = { name: d().name, rows: S.rows }; $("#pin").textContent = "Unpin"; A.toast("Pinned. Change the design to compare against it."); }
      drawSweep();
    };
    $("#table-toggle").onclick = () => { const t = $("#sweep-table"); t.hidden = !t.hidden; $("#table-toggle").textContent = t.hidden ? "Table" : "Chart only"; if (!t.hidden) fillTable(); drawSweep(); };
    $("#nec-check").onclick = runNec;
    $$("#pattern-seg button").forEach((b) => { b.onclick = () => setPatternMode(b.dataset.mode); });
    bindSweepPointer();
  }

  function setCursor(f) {
    S.cursor = f;
    const inp = $("#cursor-f");
    if (inp) inp._refresh();
    drawSweep();
    A.requestSolve("cursor");
  }

  function bindSweepPointer() {
    const c = $("#sweep");
    let dragging = false;
    const at = (e) => {
      const r = c.getBoundingClientRect();
      return c._invX ? c._invX(e.clientX - r.left) : null;
    };
    c.addEventListener("pointerdown", (e) => {
      const f = at(e);
      if (f === null) return;
      dragging = true; c.setPointerCapture(e.pointerId);
      setCursor(+Math.min(S.range[1], Math.max(S.range[0], f)).toFixed(3));
    });
    c.addEventListener("pointermove", (e) => {
      const f = at(e);
      if (f === null || !S.rows) return;
      const fx = Math.min(S.range[1], Math.max(S.range[0], f));
      if (dragging) setCursor(+fx.toFixed(3));
      const row = (k) => A.interp(S.rows, fx, k);
      const zr = S.rows.map((r) => ({ f: r.f, r: r.z[0], x: r.z[1] }));
      let html = `<b class="mono">${fx.toFixed(2)} MHz</b><br><span class="mono">SWR ${row("swr").toFixed(2)} · ${row("gainDbd").toFixed(2)} dBd · F/B ${row("fb").toFixed(1)} dB<br>${A.interp(zr, fx, "r").toFixed(1)} ${A.interp(zr, fx, "x") >= 0 ? "+" : "−"} j${Math.abs(A.interp(zr, fx, "x")).toFixed(1)} ohm</span>`;
      if (S.pinned) html += `<br><span class="mono">${esc(S.pinned.name)}: SWR ${A.interp(S.pinned.rows, fx, "swr").toFixed(2)} · ${A.interp(S.pinned.rows, fx, "gainDbd").toFixed(2)} dBd</span>`;
      A.showTip(html, e.clientX, e.clientY);
    });
    const up = () => { dragging = false; };
    c.addEventListener("pointerup", up);
    c.addEventListener("pointercancel", up);
    c.addEventListener("pointerleave", () => A.hideTip());
  }

  /* ---------- the rod table ---------- */
  function renderRods() {
    const d = S.design, t = $("#rods");
    const sorted = d.elements.slice().sort((a, b) => a.x - b.x);
    t.innerHTML = `<colgroup><col style="width:58px"><col style="width:56px"><col style="width:56px"><col style="width:44px"><col style="width:60px"><col style="width:16px"></colgroup><thead><tr><th>Rod</th><th>From R</th><th>Length</th><th>Dia.</th><th>Metal</th><th></th></tr></thead><tbody>` + sorted.map((e, i) => `
      <tr data-id="${e.id}">
        <td class="rod-name">${esc(e.name)}</td>
        <td><input class="num" data-f="x" aria-label="${esc(e.name)} position" inputmode="decimal" ${i === 0 ? "disabled" : ""}></td>
        <td><input class="num" data-f="L" aria-label="${esc(e.name)} length" inputmode="decimal"></td>
        <td><input class="num" data-f="d" aria-label="${esc(e.name)} diameter" inputmode="decimal"></td>
        <td><select class="sel" data-f="m" aria-label="${esc(e.name)} metal" style="min-height:26px;padding:1px 2px;font-size:12px">${Object.entries(METALS).map(([k, v]) => `<option value="${k}"${(e.material || d.material) === k ? " selected" : ""}>${v}</option>`).join("")}</select></td>
        <td>${e.type === "director" ? `<button class="x" aria-label="Remove ${esc(e.name)}" data-rm>×</button>` : ""}</td>
      </tr>`).join("") + "</tbody>";
    $$("tr[data-id]", t).forEach((tr) => {
      const e = d.elements.find((q) => q.id === tr.dataset.id);
      const live = (c) => { if (c) A.commit(); A.designChanged(false); drawLayout(); };
      A.bindNum($('[data-f="x"]', tr), { get: () => e.x, min: 0, decimals: 2, set: (v, c) => { e.x = v; if (c) { d.elements.sort((p, q) => p.x - q.x); YS.renameElements(d.elements); A.commit(); A.designChanged(true); } else live(false); } });
      A.bindNum($('[data-f="L"]', tr), { get: () => e.L, min: 1, decimals: 2, set: (v, c) => { e.L = v; live(c); } });
      A.bindNum($('[data-f="d"]', tr), { get: () => e.d, min: 0.05, max: 200, decimals: 3, set: (v, c) => { e.d = v; live(c); } });
      $('[data-f="m"]', tr).onchange = (ev) => { e.material = ev.target.value; A.commit(); A.designChanged(false); };
      const rm = $("[data-rm]", tr);
      if (rm) rm.onclick = () => { d.elements = d.elements.filter((q) => q !== e); YS.renameElements(d.elements); A.commit(); A.designChanged(true); };
      tr.addEventListener("pointerenter", () => { if (layout) layout.setHot(e.id); tr.classList.add("hot"); });
      tr.addEventListener("pointerleave", () => { if (layout) layout.setHot(null); tr.classList.remove("hot"); });
    });
    boomNote();
  }
  function boomNote() {
    const b = YS.boomLength(S.design), n = $("#boom-note"), lam = 299792.458 / S.design.f0;
    if (n) n.textContent = `Boom ${b.toFixed(1)} mm · ${(b / lam).toFixed(2)} wavelengths`;
  }

  /** What the wire across the gap adds at the target. */
  function syncWire() {
    const d = S.design, on = d.feedWire > 0, driven = d.elements.find((e) => e.type === "driven");
    $("#wire-on").checked = on;
    $("#wire-fields").hidden = !on;
    const x = driven ? YS.feedWireX(d, driven.d / 2) * d.f0 : 0;
    $("#wire-note").textContent = on ? `+${x.toFixed(1)} ohm in series` : "";
  }

  /** A row for each rod: off center, then each tip, along the boom and across it. */
  const BEND_KEYS = [["shift", "Off center"], ["topF", "Top, forward"], ["topS", "Top, side"], ["botF", "Bottom, forward"], ["botS", "Bottom, side"]];
  function renderBends() {
    const d = S.design, t = $("#bends");
    const sorted = d.elements.slice().sort((a, b) => a.x - b.x);
    t.innerHTML = `<thead><tr><th>Rod</th>${BEND_KEYS.map(([, h]) => `<th style="white-space:normal;line-height:1.15;vertical-align:bottom">${h.replace(", ", "<br>").replace("forward", "fwd")}</th>`).join("")}</tr></thead><tbody>${sorted.map((e) => `<tr><td class="rod-name">${esc(e.name)}</td>${BEND_KEYS.map(([k, h]) => `<td><input class="num" data-rod="${e.id}" data-k="${k}" inputmode="text" aria-label="${esc(e.name)}: ${h}"></td>`).join("")}</tr>`).join("")}</tbody>`;
    $$("input", t).forEach((i) => {
      const id = i.dataset.rod, k = i.dataset.k, rod = () => S.design.elements.find((q) => q.id === id);
      A.bindNum(i, { get: () => { const e = rod(); return e && e.bend && e.bend[k] ? e.bend[k] : 0; }, min: -500, max: 500, decimals: 1,
        parse: (s) => (s.trim() === "" ? 0 : Number(s)),
        set: (v, c) => {
          const e = rod();
          if (!e) return;
          const b = Object.assign({}, e.bend);
          if (v) b[k] = v; else delete b[k];
          if (Object.keys(b).length) e.bend = b; else delete e.bend;
          bendNote();
          drawLayout();
          if (c) A.commit();
          A.designChanged(false);
        } });
    });
    bendNote();
  }
  function bendNote() {
    const d = S.design, n = $("#bend-note");
    if (!n) return;
    const any = YS.isCrooked(YS.toSolver(d));
    if (any) $("#bend-more").open = true;
    n.innerHTML = any
      ? `<span class="pill warn">Rods not straight</span> Using the general solver, which takes longer. Optimize treats rods as straight, and the NEC and YagiCAD files do too.`
      : "All straight and centered. Tune my antenna can suggest bends, and Build check can add random ones.";
  }

  function syncForm() {
    const d = S.design;
    ["#f0", "#band-lo", "#band-hi", "#gap", "#z0", "#mast-d", "#mast-b", "#mast-l", "#ground-h", "#range-lo", "#range-hi", "#cursor-f"].forEach((q) => { const i = $(q); if (i && i._refresh && document.activeElement !== i) i._refresh(); });
    $("#pol").value = d.polarization;
    $("#endcap").checked = d.endCap !== false;
    $("#mast-on").checked = d.mast.on;
    $("#mast-fields").hidden = !d.mast.on;
    $("#ground-on").checked = d.ground.on;
    $("#ground-fields").hidden = !d.ground.on;
    $("#ground-k").value = d.ground.kind;
    $("#design-notes").textContent = d.notes || "";
    syncPatternTabs();
    A.radio.renderCard();
    syncWire();
    renderBends();
  }

  function syncRodsValues() {
    $$("#rods input.num").forEach((i) => { if (i._refresh && document.activeElement !== i) i._refresh(); });
    boomNote();
  }

  /* ---------- drawing ---------- */
  function drawLayout() {
    if (layout) layout.set(S.design, S.detail && S.detail.metrics);
  }

  function drawSweep() {
    if (!S.rows || !$("#sweep")) return;
    const T = YS.tokens(), rows = S.rows, d = S.design;
    const series = (key, color, src, name, width) => ({ name, color, width, pts: src.map((r) => [r.f, r[key]]) });
    const pinned = (key) => (S.pinned ? [series(key, T.pin, S.pinned.rows, S.pinned.name)] : []);
    const nec = (key) => (S.nec ? [series(key, T.s3, S.nec, "nec2++")] : []);
    const v = A.valleyOfRows(rows);
    const maxSwr = Math.min(5, Math.max(3, 1.1 * Math.min(5, Math.max.apply(null, rows.map((r) => Math.min(r.swr, 5))))));
    YS.drawSweep($("#sweep"), {
      xr: S.range, band: d.band, target: d.f0, targetLabel: "", cursor: S.cursor,
      rows: [
        { key: "swr", title: "SWR", yr: [1, maxSwr], ticks: maxSwr > 3.5 ? [1, 2, 3, 4, 5] : [1, 1.5, 2, 2.5, 3], note: `valley ${v.f.toFixed(1)} MHz at ${v.swr.toFixed(2)}`, series: [...pinned("swr"), ...nec("swr"), series("swr", T.s1, rows, d.name)] },
        { key: "gain", title: "Gain, dBd", series: [...pinned("gainDbd"), ...nec("gainDbd"), series("gainDbd", T.s1, rows, d.name)], minPad: 0.2 },
        { key: "fb", title: "Front-to-back, dB", floor: 0, series: [...pinned("fb"), ...nec("fb"), series("fb", T.s1, rows, d.name)], minPad: 1 },
      ],
    });
    const items = [`<span><i style="background:${T.s1}"></i>${esc(d.name)}</span>`];
    if (S.pinned) items.push(`<span><i style="background:${T.pin}"></i>Pinned: ${esc(S.pinned.name)}</span>`);
    if (S.nec) items.push(`<span><i style="background:${T.s3}"></i>nec2++, 31 segments</span>`);
    $("#sweep-legend").innerHTML = items.join("");
    if (!$("#sweep-table").hidden) fillTable();
  }

  function fillTable() {
    if (!S.rows) return;
    const every = Math.max(1, Math.round(S.rows.length / 40));
    $("#sweep-table").innerHTML = `<table class="tbl"><thead><tr><th>MHz</th><th>SWR</th><th>Gain, dBd</th><th>F/B, dB</th><th>R, ohm</th><th>X, ohm</th></tr></thead><tbody>` +
      S.rows.filter((_, i) => i % every === 0).map((r) => `<tr><td style="font-family:var(--mono)">${r.f.toFixed(2)}</td><td>${fmt(r.swr, 2)}</td><td>${fmt(r.gainDbd, 2)}</td><td>${fmt(r.fb, 1)}</td><td>${fmt(r.z[0], 1)}</td><td>${fmt(r.z[1], 1)}</td></tr>`).join("") + "</tbody></table>";
  }

  function kpi(key, label, value, unit, sub, help) {
    return `<div class="kpi" data-k="${key}"><div class="k">${label} ${help ? A.help(help) : ""}</div><div class="v">${value}${unit ? `<small>${unit}</small>` : ""}</div><div class="sub">${sub || "&nbsp;"}</div></div>`;
  }

  function drawKpis() {
    if (!S.detail) return;
    const m = S.detail.metrics, [cls, word] = A.swrClass(m.swr);
    const signX = m.z[1] >= 0 ? "+" : "−";
    const rl = -20 * Math.log10(Math.abs((m.swr - 1) / (m.swr + 1)) || 1e-6);
    const lossMis = -10 * Math.log10(1 - Math.pow((m.swr - 1) / (m.swr + 1), 2));
    const lossOhm = -10 * Math.log10(Math.max(m.efficiency, 1e-6));
    $("#kpis").innerHTML =
      kpi("swr", "SWR", fmt(m.swr, 2), "", `<span class="pill ${cls}">${word}</span> · ${fmt(lossMis, 2)} dB lost`, "swr") +
      kpi("gain", "Gain", fmt(m.gainDbd, 2), "dBd", `${fmt(m.gainDbi, 2)} dBi`, "gain") +
      kpi("fb", "Front-to-back", fmt(m.fb, 1), "dB", `Front-to-rear ${fmt(m.fr, 1)} dB ${A.help("fr")}`, "fb") +
      kpi("z", "Feed impedance", `${fmt(m.z[0], 1)} ${signX} j${fmt(Math.abs(m.z[1]), 1)}`, "Ω", `Return loss ${fmt(rl, 1)} dB`, "z") +
      kpi("bw", "Beamwidth", `${fmt(m.bwH, 0)}° × ${fmt(m.bwE, 0)}°`, "", S.design.polarization === "vertical" ? "Across × along the rods" : "Across × along the rods", "bw") +
      kpi("eff", "Efficiency", fmt(m.efficiency * 100, 1), "%", `${fmt(lossOhm, 2)} dB lost in the metal`, "eff");
  }

  function drawInsight() {
    if (!S.rows) return;
    const d = S.design, v = A.valleyOfRows(S.rows), at = A.interp(S.rows, d.f0, "swr"), [cls, word] = A.swrClass(at);
    const off = v.f - d.f0, win = A.swrWindow(S.rows, 1.5);
    const bandRows = S.rows.filter((r) => r.f >= d.band[0] && r.f <= d.band[1]);
    const worstG = bandRows.length ? Math.min.apply(null, bandRows.map((r) => r.gainDbd)) : NaN;
    const onTarget = Math.abs(off) < 0.003 * d.f0;
    let tip;
    if (onTarget) tip = v.swr > 1.25 ? "The valley is on target but shallow. The driven element sets its depth." : "The valley sits on your target.";
    else tip = `${off > 0 ? "Longer" : "Shorter"} directors move the valley ${off > 0 ? "down" : "up"}. The driven element barely moves it. ${A.help("valley")}`;
    $("#insight").innerHTML =
      `<span><b>${fmt(at, 2)}</b> SWR at ${fmt(d.f0, 3)} MHz <span class="pill ${cls}">${word}</span></span>` +
      `<span>Valley at <b>${fmt(v.f, 1)} MHz</b>${onTarget ? "" : `, ${fmt(Math.abs(off), 1)} MHz ${off > 0 ? "above" : "below"} target`}</span>` +
      (win ? `<span>SWR under 1.5 from ${fmt(win[0], 0)} to ${fmt(win[1], 0)} MHz</span>` : `<span>SWR never under 1.5 in this sweep</span>`) +
      (isFinite(worstG) ? `<span>${fmt(worstG, 2)} dBd or better across the band</span>` : "") +
      `<span class="tip">${tip}</span>`;
  }

  function drawSmith() {
    if (!S.rows || !$("#smith")) return;
    const T = YS.tokens(), d = S.design, z0 = d.z0;
    const gam = (r) => YS.gammaOf(r.z, z0);
    const traces = [];
    if (S.pinned) traces.push({ name: S.pinned.name, color: T.pin, pts: S.pinned.rows.map(gam) });
    if (S.nec) traces.push({ name: "nec2++", color: T.s3, pts: S.nec.map(gam) });
    const inBand = S.rows.filter((r) => r.f >= d.band[0] && r.f <= d.band[1]);
    traces.push({ name: d.name, color: T.s1, pts: S.rows.map(gam), marks: inBand.length ? [{ g: gam(inBand[0]) }, { g: gam(inBand[inBand.length - 1]) }] : [] });
    YS.drawSmith($("#smith"), traces, S.detail ? YS.gammaOf(S.detail.metrics.z, z0) : null);
  }

  function syncPatternTabs() {
    const on = S.design.ground.on;
    $("#ground-tab").hidden = !on;
    if (!on && S.patternMode === "ground") S.patternMode = "3d";
    $$("#pattern-seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === S.patternMode)));
    $("#pattern-3d").hidden = S.patternMode !== "3d";
    $("#pattern-polar").hidden = S.patternMode !== "polar";
    $("#pattern-ground").hidden = S.patternMode !== "ground";
  }
  function setPatternMode(m) { S.patternMode = m; syncPatternTabs(); drawPattern(); }

  function drawPattern() {
    if (!S.detail) return;
    const T = YS.tokens(), m = S.detail.metrics, d = S.design;
    if (S.patternMode === "3d") {
      if (view3d && view3d.gl) {
        view3d.update(d, m, S.detail.pattern, colors());
        $("#gl-note").textContent = `Peak ${fmt(view3d.peak, 1)} dBi, 30 dB range. Orange rods carry the most current. Drag to turn.`;
      } else {
        $("#gl-note").textContent = "3D needs WebGL, which this browser has turned off. The Cuts view shows the same pattern.";
      }
    } else if (S.patternMode === "polar") {
      const v = d.polarization === "vertical";
      const ref = m.gainDbi;
      YS.drawPolar($("#polar-h"), { title: v ? "Azimuth, from above" : "Elevation, from the side", ref, series: [{ name: "H", color: T.s1, angles: m.cuts.angles, db: m.cuts.h }] });
      YS.drawPolar($("#polar-e"), { title: v ? "Elevation, from the side" : "Azimuth, from above", ref, series: [{ name: "E", color: T.s1, angles: m.cuts.angles, db: m.cuts.e }] });
